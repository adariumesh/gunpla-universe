name: CI

# Vercel builds and deploys every push itself (production from main, previews
# for other branches). This workflow is the gate: protect main on it so a
# failed data audit or test never reaches production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
